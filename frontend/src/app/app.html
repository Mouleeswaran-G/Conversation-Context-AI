<div class="app">

  <header class="header">
    <h1>🧠 Conversation Context AI</h1>
    <p>Talk. Connect. Understand.</p>
  </header>

  <main class="chat-container">

    <div class="message user-message">
      <div class="avatar">👤</div>

      <div class="message-content">
        <strong>Moule</strong>
        <p>Hello! How are you?</p>
      </div>
    </div>

    <div class="message bot-message">
      <div class="avatar">🤖</div>

      <div class="message-content">
        <strong>AI Companion</strong>
        <p>I'm doing great! How can I help you today?</p>
      </div>
    </div>

  </main>

  <div class="input-area">

    <input
      type="text"
      placeholder="Type your message..."
    />

    <button>Send</button>

  </div>

  <button class="end-button">
    🔴 End Conversation
  </button>

</div>
