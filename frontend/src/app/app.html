<div class="app">

  <header class="header">
    <h1>🧠 Conversation Context AI</h1>
    <p>Talk. Connect. Understand.</p>
  </header>

  <main class="chat-container">

    @for (msg of messages; track $index) {

      <div
        class="message"
        [class.user-message]="msg.sender === 'Moule'"
        [class.bot-message]="msg.sender === 'AI'"
      >

        <div class="avatar">
          {{ msg.sender === 'Moule' ? '👤' : '🤖' }}
        </div>

        <div class="message-content">

          <strong>{{ msg.sender }}</strong>

          <p>{{ msg.text }}</p>

        </div>

      </div>

    }

  </main>

  <div class="input-area">

    <input
      type="text"
      placeholder="Type your message..."
      [(ngModel)]="message"
      (keyup.enter)="sendMessage()"
    />

    <button (click)="sendMessage()">
      Send
    </button>

  </div>

  <button class="end-button">
    🔴 End Conversation
  </button>

</div>
